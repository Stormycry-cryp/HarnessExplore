name: Bootstrap checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  bootstrap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check Bash syntax
        run: bash -n harness-explore/scripts/bootstrap_codex.sh
      - name: Test offline and snapshot contracts
        run: python3 -m unittest discover -s tests -v
